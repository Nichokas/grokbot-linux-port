name: Auto Update

"on":
  schedule:
    # 37 minutes past 06:00 UTC — deliberately off :00/:30 to avoid the
    # thundering herd that concentrates load on shared GitHub Actions
    # runners and on the upstream downloads.cursor.com origin.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Grok Bot version to build (e.g. 0.19.0) — bypasses candidate probing"
        required: false
        default: ""
        type: string
  pull_request:
    # Smoke-build gate: a change to the porting or detection logic must prove
    # itself against the real installer before merge. Path-filtered so
    # docs/VERSION/README changes don't trigger a ~250 MB download + native
    # rebuild. The release job is separately gated against pull_request below,
    # so a PR can never publish. update-aur.sh is intentionally excluded here:
    # it only runs inside the release job, so a PR smoke-build cannot exercise
    # it — listing it would give false confidence that the AUR bump path was
    # tested. aur/** is intentionally included so AUR-only PRs still trigger
    # aur-lint; the build job's need_build gate skips the heavy download for
    # those PRs (see build.steps[0]).
    paths:
      - "scripts/port.sh"
      - "scripts/detect-version.sh"
      - "scripts/update-spec.sh"
      - "scripts/build-deb.sh"
      - "grokbot-linux-port.spec"
      - "aur/**"
      - ".github/workflows/auto-update.yml"
      - ".github/workflows/ppa-publish.yml"

# Least-privilege default; release job elevates contents to write via
# permissions block.  Top-level permissions are the fallback for any job
# that does not declare its own.
permissions:
  contents: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # detect-version — version-anchored HEAD-probing discovery
  #
  # Reads the current VERSION file as base, generates the candidate set
  # covering non-linear jumps (patch sweep, minor sweep, next-patch,
  # major sweep), HEAD-probes each win32 artifact URL, selects the highest
  # semver candidate returning 200, and decides whether a build is warranted.
  # When workflow_dispatch supplies inputs.version, that version is verified
  # directly and treated as authoritative irrespective of the candidate set.
  # -----------------------------------------------------------------------
  detect-version:
    runs-on: namespace-profile-grokbot-lite
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      is_new: ${{ steps.detect.outputs.is_new }}
      rebuild: ${{ steps.detect.outputs.rebuild }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect latest Grok Bot version
        id: detect
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Forward dispatch input as positional arg when present; the script
          # also honours INPUT_VERSION directly so either path is covered.
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            bash scripts/detect-version.sh "${INPUT_VERSION}"
          else
            bash scripts/detect-version.sh
          fi
          # The script writes version/is_new to $GITHUB_OUTPUT and prints the
          # bare version as its last stdout line — capture both for the log.
          echo "detect-version outputs: version=$(grep '^version=' "$GITHUB_OUTPUT" | cut -d= -f2) is_new=$(grep '^is_new=' "$GITHUB_OUTPUT" | cut -d= -f2)"

  # -----------------------------------------------------------------------
  # build — produce Linux artefacts for the detected version
  #
  # Runs port.sh <version> which downloads the win32 NSIS installer, extracts
  # it wine-less (7z x; the app-64.7z payload is located recursively — current
  # installers nest it under $PLUGINSDIR/), fuses the payload with Electron
  # 42.1.0 linux-x64, rebuilds the six native modules via @electron/rebuild,
  # fixes chrome-sandbox permissions, and emits tar.gz (always) and
  # AppImage (best-effort via AppDir + appimagetool). Arch matrix is present
  # so arm64 can be enabled by expanding `arch`.
  # -----------------------------------------------------------------------
  build:
    needs: detect-version
    # Two entry points: (a) production — a newer version was detected, build
    # it; (a') explicit rebuild — workflow_dispatch with the current version
    # forces a rebuild + AUR resync (port.sh fixes must reach AUR users);
    # (b) pull_request — smoke-build the pinned VERSION to prove the porting
    # path still works. On (b) with no new version, detect-version returns
    # the base VERSION and this builds that.
    if: needs.detect-version.outputs.is_new == 'true' || needs.detect-version.outputs.rebuild == 'true' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
        # To enable arm64, extend to [x64, arm64] and add a conditional
        # electron arch mapping inside the build step (x64 -> x64, arm64 ->
        # arm64) and adjust the Electron download URL accordingly.
    runs-on: namespace-profile-grokbot
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if build is needed (skip AUR-only PRs)
        id: need_build
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On PR, skip heavy build when only aur/ or docs changed
          base="origin/${{ github.base_ref }}"
          git fetch --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
          changed="$(git diff --name-only "$base"...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || echo 'scripts/port.sh')"
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qvE '^(aur/|README\.md$|VERSION$)' && echo "$changed" | grep -qE '^(scripts/(port\.sh|detect-version\.sh|build-deb\.sh)|\.github/workflows/(auto-update|ppa-publish)\.yml)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qE '^(scripts/(port\.sh|detect-version\.sh|build-deb\.sh)|\.github/workflows/(auto-update|ppa-publish)\.yml)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUR/docs-only PR — skipping heavy Linux port build (aur-lint still runs)"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 22
        if: steps.need_build.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        if: steps.need_build.outputs.needed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Namespace cache volume instead of actions/cache: instant NVMe hits,
      # no upload/download leg, and no key-busting — entries survive port.sh
      # edits and Electron bumps instead of being invalidated by hashFiles.
      # Holds both the Electron linux zip and the win32 installers port.sh
      # fetches (see GROKBOT_CACHE_DIR in the build step), so PR smoke-builds
      # stop re-downloading ~250 MB per run.
      - name: Restore cached downloads (Electron zip + win32 installers)
        if: steps.need_build.outputs.needed == 'true'
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ${{ github.workspace }}/.cache/downloads

      - name: Install system dependencies
        if: steps.need_build.outputs.needed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # p7zip-full provides 7z for wine-less NSIS extraction; unzip for
          # Electron archive; build-essential + python3 for node-gyp native
          # rebuilds (better-sqlite3, tree-sitter, etc.).
          sudo apt-get install -y --no-install-recommends \
            p7zip-full unzip squashfs-tools build-essential python3

      - name: Install Node dependencies (rebuild tooling)
        if: steps.need_build.outputs.needed == 'true'
        run: |
          set -euo pipefail
          # No lockfile needed — tools are invoked via bunx/npx at build time.
          # Pre-warm the cache for faster port.sh execution.
          if command -v bun >/dev/null 2>&1; then
            bunx --yes @electron/asar --help >/dev/null 2>&1 || true
            bunx --yes @electron/rebuild --help >/dev/null 2>&1 || true
          else
            npx --yes @electron/asar --help >/dev/null 2>&1 || true
            npx --yes @electron/rebuild --help >/dev/null 2>&1 || true
          fi

      - name: Build Linux port for ${{ needs.detect-version.outputs.version }}
        if: steps.need_build.outputs.needed == 'true'
        env:
          GROK_VERSION: ${{ needs.detect-version.outputs.version }}
          ELECTRON_VERSION: "42.1.0"
          # Same path nscloud-cache-action persists above; port.sh stores the
          # win32 installer + Electron zip here and reuses them on later runs.
          GROKBOT_CACHE_DIR: ${{ github.workspace }}/.cache/downloads
        run: |
          set -euo pipefail
          echo "Building Grok Bot ${GROK_VERSION} for linux-${{ matrix.arch }} (Electron ${ELECTRON_VERSION})"
          bash scripts/port.sh "${GROK_VERSION}"
          echo "Build artefacts:"
          ls -lh dist/ || true

      - name: Upload build artefacts
        if: steps.need_build.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grokbot-linux-${{ needs.detect-version.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # -----------------------------------------------------------------------
  # aur-lint — validate AUR PKGBUILDs on PRs touching aur/
  #
  # Lightweight gate so an AUR-only PR with a broken PKGBUILD does not get
  # a green check from the unrelated Linux smoke build. Uses namcap when
  # available, else falls back to `bash -n` + `makepkg --printsrcinfo` checks.
  # Only runs on pull_request to avoid duplicate work on scheduled/dispatch.
  # -----------------------------------------------------------------------
  aur-lint:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-grokbot-lite
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint AUR PKGBUILDs
        run: |
          set -euo pipefail
          # makepkg refuses to run as root; archlinux:base-devel defaults to root.
          # Create an unprivileged build user for srcinfo checks.
          if ! id -u builder >/dev/null 2>&1; then
            useradd -m builder 2>/dev/null || true
          fi
          chown -R builder:builder aur 2>/dev/null || true
          run_as_builder() { runuser -u builder -- bash -c "$1"; }
          failed=0
          for dir in aur/grokbot-linux-port aur/grokbot-linux-port-bin; do
            echo "==> Checking ${dir}/PKGBUILD"
            if [[ ! -f "${dir}/PKGBUILD" ]]; then
              echo "  skip (no PKGBUILD)"
              continue
            fi
            bash -n "${dir}/PKGBUILD" || { echo "  FAIL: bash -n"; failed=1; continue; }
            if command -v makepkg >/dev/null 2>&1; then
              run_as_builder "cd \"${dir}\" && makepkg --printsrcinfo >/dev/null" || { echo "  FAIL: makepkg --printsrcinfo"; failed=1; continue; }
              run_as_builder "cd \"${dir}\" && diff -u .SRCINFO <(makepkg --printsrcinfo)" || { echo "  FAIL: .SRCINFO out of date — run scripts/update-aur.sh or makepkg --printsrcinfo"; failed=1; }
            else
              echo "  FAIL: makepkg not found in archlinux:base-devel image — runner misconfigured" >&2
              failed=1
            fi
            if command -v namcap >/dev/null 2>&1; then
              namcap "${dir}/PKGBUILD" || echo "  (namcap warnings — non-fatal)"
            fi
          done
          exit "${failed}" 

  # -----------------------------------------------------------------------
  # spec-lint — validate the RPM spec on PRs touching it
  #
  # Same idea as aur-lint for the COPR side: rpmbuild -bs parses the spec
  # fully (macros, %prep/%install/%files) without downloading Source0, so a
  # broken spec fails here instead of inside COPR's srpm stage.
  # -----------------------------------------------------------------------
  spec-lint:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-grokbot-lite
    container: fedora:latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint RPM spec
        run: |
          set -euo pipefail
          dnf install -y rpm-build rpmdevtools >/dev/null
          bash -n scripts/update-spec.sh
          mkdir -p /tmp/rpmlint/SOURCES
          # rpmbuild -bs exige que todo Source exista aunque solo queramos
          # validar el spec; en CI no descargamos los tarballs reales (250 MB
          # por arch), basta un fichero vacío con el nombre que espera %{version}.
          ver="$(sed -n 's/^Version:[[:space:]]*//p' grokbot-linux-port.spec | tr -d '[:space:]')"
          touch "/tmp/rpmlint/SOURCES/Grok_Bot_${ver}_linux_x64.tar.gz"
          touch "/tmp/rpmlint/SOURCES/Grok_Bot_${ver}_linux_arm64.tar.gz"
          rpmbuild -bs --define "_topdir /tmp/rpmlint" grokbot-linux-port.spec
          if command -v rpmlint >/dev/null 2>&1; then
            rpmlint grokbot-linux-port.spec || echo "  (rpmlint warnings — non-fatal)"
          fi

  # -----------------------------------------------------------------------
  # release — publish GitHub Release, upload artefacts, bump VERSION
  #
  # Downloads the build artefacts, creates (or updates) a GitHub Release via
  # softprops/action-gh-release, commits the new VERSION file, and pushes the
  # tag.  Uses GITHUB_TOKEN with contents:write.
  # -----------------------------------------------------------------------
  release:
    needs: [detect-version, build]
    # Never from a PR: smoke builds are verification only, and a pull_request
    # must not publish a release, bump VERSION, or push a tag. rebuild=true
    # (explicit dispatch of the current version) re-uploads artifacts to the
    # existing release and resyncs the AUR -bin checksum, without touching
    # VERSION or creating a new tag.
    if: (needs.detect-version.outputs.is_new == 'true' || needs.detect-version.outputs.rebuild == 'true') && github.event_name != 'pull_request'
    runs-on: namespace-profile-grokbot-lite
    permissions:
      contents: write
    # surfaced so aur-publish can skip runs where the aur/ tree did not move.
    outputs:
      version: ${{ needs.detect-version.outputs.version }}
      tarball_sum_x64: ${{ steps.artifacts.outputs.tarball_sum_x64 }}
      tarball_sum_arm64: ${{ steps.artifacts.outputs.tarball_sum_arm64 }}
      aur_changed: ${{ steps.aur-bump.outputs.changed }}
      spec_changed: ${{ steps.spec-bump.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required for tag creation and for the VERSION commit
          # to be pushed on top of the current HEAD.
          fetch-depth: 0
          persist-credentials: true

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artefacts
        run: |
          set -euo pipefail
          echo "Release artefacts:"
          ls -lh dist/ || true
          find dist -type f -exec ls -lh {} \;

      - name: Hash release tarballs
        id: artifacts
        env:
          VER: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail
          # Hash the exact bytes this job will upload. update-aur.sh must not
          # re-hash the published URL: GitHub's asset CDN races propagation of
          # freshly uploaded assets, and a re-upload leaves the old sum behind.
          # Each arch is optional — when the build matrix didn't publish a
          # tarball for an arch, the corresponding output stays empty and the
          # AUR/spec steps below skip that arch instead of rejecting an empty
          # --bin-sum-* arg.
          for arch in x64 arm64; do
            tarball="dist/Grok_Bot_${VER}_linux_${arch}.tar.gz"
            if [[ -f "${tarball}" ]]; then
              sum="$(sha256sum "${tarball}" | awk '{print $1}')"
              echo "tarball_sum_${arch}=${sum}" >> "${GITHUB_OUTPUT}"
              echo "sha256(${tarball}) = ${sum}"
            else
              echo "tarball_sum_${arch}=" >> "${GITHUB_OUTPUT}"
              echo "::notice::no ${tarball} — skipping ${arch} hash (build matrix may not have published this arch)"
            fi
          done

      - name: Fix chrome-sandbox permissions in tarball (post-hoc note)
        run: |
          echo "Note: chrome-sandbox inside the tarball is set to 4755 during build when running as root."
          echo "Consumers extracting as non-root must run: sudo chown root:root chrome-sandbox && sudo chmod 4755 chrome-sandbox"

      - name: Create GitHub Release
        id: ghrelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: Grok Bot ${{ needs.detect-version.outputs.version }} (Linux port)
          # Always overwrite: a workflow re-run rebuilds non-deterministic
          # tarball bytes; skipping existing assets would publish the -bin
          # checksum of bytes the release no longer serves.
          overwrite_files: true
          body: |
            Linux port of Grok Bot `${{ needs.detect-version.outputs.version }}`.

            Built from the official Windows distribution via wine-less extraction (`7z x`, recursive `app-64.7z` locate) fused with Electron 42.1.0 (linux-x64), with native modules rebuilt via `@electron/rebuild`.

            **Install**

            ```bash
            tar -xzf Grok_Bot_${{ needs.detect-version.outputs.version }}_linux_x64.tar.gz
            cd Grok_Bot_${{ needs.detect-version.outputs.version }}_linux_x64
            # chrome-sandbox requires setuid when not using --no-sandbox
            sudo chown root:root chrome-sandbox && sudo chmod 4755 chrome-sandbox
            ./grok-bot
            ```

            **Artefacts**

            - `Grok_Bot_<version>_linux_x64.tar.gz` — portable archive
            - `Grok_Bot_<version>_x86_64.AppImage` — AppImage (best-effort, requires squashfs-tools + appimagetool)

            *Automated build — triggered by daily HEAD-probing of `https://downloads.cursor.com/grokbot/stable/win32-x64/<version>/Grok_Bot_<version>_Setup.exe`.*
          files: |
            dist/*.tar.gz
            dist/*.AppImage
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump AUR PKGBUILDs
        id: aur-bump
        env:
          VER: ${{ needs.detect-version.outputs.version }}
          TARBALL_SUM_X64: ${{ steps.artifacts.outputs.tarball_sum_x64 }}
          TARBALL_SUM_ARM64: ${{ steps.artifacts.outputs.tarball_sum_arm64 }}
          REBUILD: ${{ needs.detect-version.outputs.rebuild }}
        run: |
          set -euo pipefail
          [[ -d aur/grokbot-linux-port && -d aur/grokbot-linux-port-bin ]] || { echo "aur/ tree missing"; echo "changed=false" >> "${GITHUB_OUTPUT}"; exit 0; }

          # Build the --bin-sum-* args array conditionally: update-aur.sh
          # rejects an empty sum, and a build matrix that didn't publish an
          # arch (e.g. arm64 not yet enabled) would otherwise set the env
          # to "" and break the bump. Only forward sums that are non-empty.
          aur_sum_args=()
          [[ -n "${TARBALL_SUM_X64}" ]] && aur_sum_args+=(--bin-sum-x64 "${TARBALL_SUM_X64}")
          [[ -n "${TARBALL_SUM_ARM64}" ]] && aur_sum_args+=(--bin-sum-arm64 "${TARBALL_SUM_ARM64}")

          if [[ "${REBUILD}" == "true" ]]; then
            # Rebuild resync: the tag and its source archive predate this
            # run, so only the -bin package's freshly rebuilt bytes can be
            # stale. Inject the new sum (a plain pkgrel bump would keep the
            # stale checksum — the exact failure this workflow fixes) and
            # bump pkgrel; AUR helpers ignore same-pkgrel updates. VERSION
            # is left untouched — nothing version-related changed.
            echo "Rebuild of ${VER} — resyncing -bin checksum + pkgrel"
            bash scripts/update-aur.sh --bin-only "${aur_sum_args[@]}" "${VER}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Bumping AUR packages to ${VER} (x64=${TARBALL_SUM_X64:-<none>} arm64=${TARBALL_SUM_ARM64:-<none>})"
          bash scripts/update-aur.sh "${aur_sum_args[@]}" "${VER}"
          if git diff --quiet -- aur/; then
            echo "AUR PKGBUILDs already carried ${VER} — nothing to commit"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            for pkg in grokbot-linux-port grokbot-linux-port-bin; do
              git add "aur/${pkg}/PKGBUILD" "aur/${pkg}/.SRCINFO"
            done
          fi

      - name: Bump RPM spec (COPR)
        id: spec-bump
        env:
          VER: ${{ needs.detect-version.outputs.version }}
          TARBALL_SUM_X64: ${{ steps.artifacts.outputs.tarball_sum_x64 }}
          TARBALL_SUM_ARM64: ${{ steps.artifacts.outputs.tarball_sum_arm64 }}
          REBUILD: ${{ needs.detect-version.outputs.rebuild }}
        run: |
          set -euo pipefail
          [[ -f grokbot-linux-port.spec ]] || { echo "grokbot-linux-port.spec missing"; echo "changed=false" >> "${GITHUB_OUTPUT}"; exit 0; }

          # Same conditional-passing rule as the AUR step: update-spec.sh
          # only gets --sum-x64 / --sum-arm64 for arches that actually
          # published a tarball this run. The legacy --sum form keeps the
          # existing x64 behaviour so a single-arch release keeps working.
          spec_args=()
          [[ -n "${TARBALL_SUM_X64}" ]] && spec_args+=(--sum-x64 "${TARBALL_SUM_X64}")
          [[ -n "${TARBALL_SUM_ARM64}" ]] && spec_args+=(--sum-arm64 "${TARBALL_SUM_ARM64}")

          if [[ "${REBUILD}" == "true" ]]; then
            # Same resync semantics as the AUR -bin package: freshly rebuilt
            # release bytes need the new checksum plus a Release bump so
            # installed clients pick the update up.
            bash scripts/update-spec.sh --bump-release "${spec_args[@]}" "${VER}"
          else
            bash scripts/update-spec.sh "${spec_args[@]}" "${VER}"
          fi
          if git diff --quiet -- grokbot-linux-port.spec; then
            echo "spec already carried ${VER} — nothing to commit"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git add grokbot-linux-port.spec
          fi

      - name: Update VERSION file and push
        env:
          DETECTED_VERSION: ${{ needs.detect-version.outputs.version }}
          AUR_CHANGED: ${{ steps.aur-bump.outputs.changed }}
          SPEC_CHANGED: ${{ steps.spec-bump.outputs.changed }}
          REBUILD: ${{ needs.detect-version.outputs.rebuild }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${REBUILD}" == "true" ]]; then
            # Rebuild resync: only aur/-bin and the spec changed; push them alone.
            if [[ "${AUR_CHANGED}" == "true" || "${SPEC_CHANGED}" == "true" ]]; then
              if [[ "${AUR_CHANGED}" == "true" ]]; then
                git add aur/grokbot-linux-port-bin/PKGBUILD aur/grokbot-linux-port-bin/.SRCINFO
              fi
              if [[ "${SPEC_CHANGED}" == "true" ]]; then
                git add grokbot-linux-port.spec
              fi
              git commit -m "chore: resync ${DETECTED_VERSION} tarball checksum (aur -bin + rpm spec)"
              git push origin "HEAD:${GITHUB_REF_NAME:-main}"
            fi
            exit 0
          fi

          echo "${DETECTED_VERSION}" > VERSION
          git add VERSION
          if git diff --cached --quiet; then
            echo "Nothing to commit (VERSION, AUR and spec already up to date)."
            exit 0
          fi
          if git diff --cached --name-only | grep -q "^aur/" && git diff --cached --name-only | grep -q "^VERSION"; then
            git commit -m "chore: bump VERSION to ${DETECTED_VERSION} (aur ${DETECTED_VERSION})"
          elif git diff --cached --name-only | grep -q "^aur/"; then
            git commit -m "chore(aur): bump to ${DETECTED_VERSION}"
          else
            git commit -m "chore: bump VERSION to ${DETECTED_VERSION}"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      - name: Poke COPR rebuild
        # GitHub suppresses push events for commits pushed with GITHUB_TOKEN,
        # so copr-publish.yml's push trigger never sees this automated bump;
        # fire its repository_dispatch directly instead. Human pushes to main
        # still reach it through the normal push trigger. A repository_dispatch
        # always runs copr-publish.yml at the default-branch head, so only
        # poke when the spec bump actually landed there — a dispatch run from
        # another branch pushes its bump elsewhere and poking would rebuild
        # stale main sources.
        if: steps.spec-bump.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w "copr-rebuild dispatch HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"copr-rebuild"}'

      - name: Poke PPA rebuild
        # Same rationale as COPR: GITHUB_TOKEN pushes suppress the push event
        # that would otherwise reach ppa-publish.yml, so dispatch it explicitly.
        # Only when on the default branch, for the same stale-main reason.
        if: steps.spec-bump.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w "ppa-rebuild dispatch HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"ppa-rebuild"}'

  # -----------------------------------------------------------------------
  # deb-lint — validate Debian source package on PRs
  #
  # Mirrors aur-lint/spec-lint: build a stub source package with build-deb.sh
  # and lint it. The stub tarball is tiny (few KB) and carries the minimal
  # layout build-deb.sh expects (grok-bot + resources/app.asar + chrome-sandbox);
  # icon extraction is best-effort so a missing app-icon is fine. lintian
  # checks are non-fatal (|| warn) while bash -n / missing .changes are fatal.
  # -----------------------------------------------------------------------
  deb-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Debian source package (stub)
        run: |
          set -euo pipefail
          bash -n scripts/build-deb.sh
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends debhelper devscripts lintian
          tmp="$(mktemp -d -t deb-lint-XXXXXX)"
          trap 'rm -rf "${tmp}"' EXIT
          mkdir -p "${tmp}/Grok_Bot_0.0.1_linux_x64/resources" "${tmp}/Grok_Bot_0.0.1_linux_x64/locales"
          printf '#!/bin/sh\necho grok-bot stub\n' > "${tmp}/Grok_Bot_0.0.1_linux_x64/grok-bot"
          chmod +x "${tmp}/Grok_Bot_0.0.1_linux_x64/grok-bot"
          touch "${tmp}/Grok_Bot_0.0.1_linux_x64/chrome-sandbox"
          echo "stub" > "${tmp}/Grok_Bot_0.0.1_linux_x64/resources/app.asar"
          stub="/tmp/Grok_Bot_0.0.1_linux_x64.tar.gz"
          tar -czf "${stub}" -C "${tmp}" Grok_Bot_0.0.1_linux_x64
          sum="$(sha256sum "${stub}" | awk '{print $1}')"
          echo "stub sha256=${sum}"
          bash scripts/build-deb.sh --tarball "${stub}" --sha256 "${sum}" --series noble --out-dir /tmp/deb-lint-out
          echo "--- .changes ---"
          cat /tmp/deb-lint-out/noble/*_source.changes
          echo "--- .dsc ---"
          cat /tmp/deb-lint-out/noble/*.dsc
          # .changes must list the source tarball (revision-agnostic: ~ppa<N>
          # mirrors the spec's Release counter, so don't pin it here)
          grep -q "grokbot-linux-port_0.0.1~ppa[0-9]*~noble1" /tmp/deb-lint-out/noble/*_source.changes
          grep -q "grokbot-linux-port_0.0.1~ppa[0-9]*~noble1" /tmp/deb-lint-out/noble/*.dsc
          # --fail-on error: warnings don't fail the gate, errors do
          lintian --fail-on error /tmp/deb-lint-out/noble/*_source.changes

  # -----------------------------------------------------------------------
  # aur-publish — push PKGBUILD + .SRCINFO to aur.archlinux.org
  #
  # The release job only updates the aur/ tree in this repo; publishing to
  # AUR requires the SSH deploy key (AUR_SSH_PRIVATE_KEY). Runs only when the
  # release job actually changed aur/ (fresh version or rebuild resync).
  # -----------------------------------------------------------------------
  aur-publish:
    needs: [release]
    # Only publish when the release changed the AUR tree, and never from a PR.
    if: needs.release.outputs.aur_changed == 'true' && github.event_name != 'pull_request'
    runs-on: namespace-profile-grokbot-lite
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The release job pushed the AUR bump commit on top of the trigger
          # SHA; without an explicit ref this job would check out the stale
          # pre-bump tree and publish outdated checksums to AUR.
          ref: ${{ github.ref_name }}

      - name: Set up AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519_aur
          chmod 600 ~/.ssh/id_ed25519_aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/id_ed25519_aur
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish to AUR
        env:
          VER: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          for pkg in grokbot-linux-port grokbot-linux-port-bin; do
            echo "::group::Publish ${pkg}"
            tmp="$(mktemp -d)"
            git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "${tmp}/${pkg}"
            git -C "${tmp}/${pkg}" config user.name "github-actions[bot]"
            git -C "${tmp}/${pkg}" config user.email "github-actions[bot]@users.noreply.github.com"
            cp "aur/${pkg}/PKGBUILD" "aur/${pkg}/.SRCINFO" "${tmp}/${pkg}/"
            git -C "${tmp}/${pkg}" add PKGBUILD .SRCINFO
            if git -C "${tmp}/${pkg}" diff --cached --quiet; then
              echo "${pkg} already up to date on AUR"
            else
              git -C "${tmp}/${pkg}" commit -m "upgpkg: ${VER}"
              git -C "${tmp}/${pkg}" push origin master
            fi
            rm -rf "${tmp}"
            echo "::endgroup::"
          done
