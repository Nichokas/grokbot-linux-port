name: Auto Update

"on":
  schedule:
    # 37 minutes past 06:00 UTC — deliberately off :00/:30 to avoid the
    # thundering herd that concentrates load on shared GitHub Actions
    # runners and on the upstream downloads.cursor.com origin.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Grok Bot version to repack (e.g. 0.30.0) — must match api2's current stable"
        required: false
        default: ""
        type: string
  pull_request:
    # Smoke-build gate: a change to the repack or detection logic must
    # prove itself against the real .deb before merge. Path-filtered so
    # docs/VERSION/README changes don't trigger a ~250 MB download. The
    # release job is separately gated against pull_request below, so a PR
    # can never publish. update-aur.sh is intentionally excluded here:
    # it only runs inside the release job, so a PR smoke-build cannot
    # exercise it — listing it would give false confidence that the AUR
    # bump path was tested. aur/** is intentionally included so AUR-only
    # PRs still trigger aur-lint; the build job's need_build gate skips
    # the heavy download for those PRs (see build.steps[0]).
    paths:
      - "scripts/repack-deb.sh"
      - "scripts/detect-version.sh"
      - "scripts/update-spec.sh"
      - "grokbot-linux-port.spec"
      - "aur/**"
      - ".github/workflows/auto-update.yml"

# Least-privilege default; release job elevates contents to write via
# permissions block.  Top-level permissions are the fallback for any job
# that does not declare its own.
permissions:
  contents: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # detect-version — read the current version from api2's canonical
  # download manifest
  #
  # GETs the manifest for both arches (app name "sand"), asserts they
  # agree on version+commit, and compares against the VERSION file. The
  # old semver HEAD-probe sweep is gone: upstream now publishes the
  # version in JSON, so detection is exact, not inferred.
  # -----------------------------------------------------------------------
  detect-version:
    runs-on: namespace-profile-grokbot-lite
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      is_new: ${{ steps.detect.outputs.is_new }}
      rebuild: ${{ steps.detect.outputs.rebuild }}
      commit: ${{ steps.detect.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect latest Grok Bot version
        id: detect
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Forward dispatch input as positional arg when present; the script
          # also honours INPUT_VERSION directly so either path is covered.
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            bash scripts/detect-version.sh "${INPUT_VERSION}"
          else
            bash scripts/detect-version.sh
          fi
          # The script writes version/is_new to $GITHUB_OUTPUT and prints the
          # bare version as its last stdout line — capture both for the log.
          echo "detect-version outputs: version=$(grep '^version=' "$GITHUB_OUTPUT" | cut -d= -f2) is_new=$(grep '^is_new=' "$GITHUB_OUTPUT" | cut -d= -f2)"

  # -----------------------------------------------------------------------
  # build — repack the official .deb(s) into release tarballs
  #
  # Runs repack-deb.sh, which resolves the current .deb per arch through
  # api2's manifest, downloads both, and reassembles each /opt payload as
  # a deterministic tar.gz. Repacking copies bytes — nothing is executed
  # or linked — so both arches build on one x64 runner; the arm64 runner
  # this matrix used to need existed only for the native-module rebuilds
  # of the win32 porting pipeline.
  # -----------------------------------------------------------------------
  build:
    needs: detect-version
    # (a) production — a newer version was detected; (a') explicit rebuild
    # — workflow_dispatch with the current version forces a rebuild + AUR
    # resync (repack fixes must reach AUR users); (b) pull_request —
    # smoke-build the pinned VERSION to prove the repack still works.
    if: needs.detect-version.outputs.is_new == 'true' || needs.detect-version.outputs.rebuild == 'true' || github.event_name == 'pull_request'
    runs-on: namespace-profile-grokbot
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if build is needed (skip AUR-only PRs)
        id: need_build
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On PR, skip heavy build when only aur/ or docs changed
          base="origin/${{ github.base_ref }}"
          git fetch --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
          changed="$(git diff --name-only "$base"...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || echo 'scripts/repack-deb.sh')"
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(scripts/(repack-deb\.sh|detect-version\.sh|update-spec\.sh)|grokbot-linux-port\.spec|\.github/workflows/auto-update\.yml)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUR/docs-only PR — skipping heavy repack (aur-lint still runs)"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # Namespace cache volume instead of actions/cache: instant NVMe hits,
      # no upload/download leg, and no key-busting — entries survive script
      # edits instead of being invalidated by hashFiles. Holds the ~190 MB
      # of upstream .debs repack-deb.sh fetches (see GROKBOT_CACHE_DIR in
      # the build step), so PR smoke-builds stop re-downloading per run.
      - name: Restore cached downloads (upstream .debs)
        if: steps.need_build.outputs.needed == 'true'
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ${{ github.workspace }}/.cache/debs

      - name: Install system dependencies
        if: steps.need_build.outputs.needed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # binutils provides ar; xz for the deb's compressed data member.
          sudo apt-get install -y --no-install-recommends binutils xz-utils

      - name: Repack Grok Bot ${{ needs.detect-version.outputs.version }}
        if: steps.need_build.outputs.needed == 'true'
        env:
          GROK_VERSION: ${{ needs.detect-version.outputs.version }}
          GROK_COMMIT: ${{ needs.detect-version.outputs.commit }}
          GROKBOT_CACHE_DIR: ${{ github.workspace }}/.cache/debs
        run: |
          set -euo pipefail
          echo "Repacking Grok Bot ${GROK_VERSION} (official .deb -> release tarballs)"
          # version+commit so a manifest change between detect and this job
          # fails the repack instead of mixing upstream commits under one
          # release (both arches must still serve the validated commit).
          bash scripts/repack-deb.sh --version "${GROK_VERSION}+${GROK_COMMIT}"
          echo "Build artefacts:"
          ls -lh dist/ || true

      - name: Upload build artefacts
        if: steps.need_build.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grokbot-linux-${{ needs.detect-version.outputs.version }}
          path: |
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # -----------------------------------------------------------------------
  # aur-lint — validate the AUR PKGBUILD on PRs touching aur/
  #
  # Lightweight gate so an AUR-only PR with a broken PKGBUILD does not get
  # a green check from the unrelated repack smoke build. Uses namcap when
  # available, else falls back to `bash -n` + `makepkg --printsrcinfo`
  # checks. Only runs on pull_request to avoid duplicate work on
  # scheduled/dispatch.
  # -----------------------------------------------------------------------
  aur-lint:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-grokbot-lite
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint AUR PKGBUILD
        run: |
          set -euo pipefail
          # makepkg refuses to run as root; archlinux:base-devel defaults to root.
          # Create an unprivileged build user for srcinfo checks.
          if ! id -u builder >/dev/null 2>&1; then
            useradd -m builder 2>/dev/null || true
          fi
          chown -R builder:builder aur 2>/dev/null || true
          run_as_builder() { runuser -u builder -- bash -c "$1"; }
          failed=0
          for dir in aur/grokbot-linux-port-bin; do
            echo "==> Checking ${dir}/PKGBUILD"
            if [[ ! -f "${dir}/PKGBUILD" ]]; then
              echo "  FAIL: ${dir}/PKGBUILD missing" >&2
              failed=1
              continue
            fi
            bash -n "${dir}/PKGBUILD" || { echo "  FAIL: bash -n"; failed=1; continue; }
            if command -v makepkg >/dev/null 2>&1; then
              run_as_builder "cd \"${dir}\" && makepkg --printsrcinfo >/dev/null" || { echo "  FAIL: makepkg --printsrcinfo"; failed=1; continue; }
              run_as_builder "cd \"${dir}\" && diff -u .SRCINFO <(makepkg --printsrcinfo)" || { echo "  FAIL: .SRCINFO out of date — run scripts/update-aur.sh or makepkg --printsrcinfo"; failed=1; }
            else
              echo "  FAIL: makepkg not found in archlinux:base-devel image — runner misconfigured" >&2
              failed=1
            fi
            if command -v namcap >/dev/null 2>&1; then
              namcap "${dir}/PKGBUILD" || echo "  (namcap warnings — non-fatal)"
            fi
          done
          exit "${failed}"

  # -----------------------------------------------------------------------
  # spec-lint — validate the RPM spec on PRs touching it
  #
  # Same idea as aur-lint for the COPR side. rpmbuild -bs only parses the
  # spec, so scriptlet bugs survive it; the smoke step below runs the real
  # %install/%files against a stub payload to catch those before COPR does.
  # -----------------------------------------------------------------------
  spec-lint:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-grokbot-lite
    container: fedora:latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint RPM spec
        run: |
          set -euo pipefail
          dnf install -y rpm-build rpmdevtools >/dev/null
          bash -n scripts/update-spec.sh
          mkdir -p /tmp/rpmlint/SOURCES
          # rpmbuild -bs exige que todo Source exista aunque solo queramos
          # validar el spec; en CI no descargamos los tarballs reales (250 MB
          # por arch), basta un fichero vacío con el nombre que espera %{version}.
          ver="$(sed -n 's/^Version:[[:space:]]*//p' grokbot-linux-port.spec | tr -d '[:space:]')"
          touch "/tmp/rpmlint/SOURCES/Grok_Bot_${ver}_linux_x64.tar.gz"
          touch "/tmp/rpmlint/SOURCES/Grok_Bot_${ver}_linux_arm64.tar.gz"
          rpmbuild -bs --define "_topdir /tmp/rpmlint" grokbot-linux-port.spec
          if command -v rpmlint >/dev/null 2>&1; then
            rpmlint grokbot-linux-port.spec || echo "  (rpmlint warnings — non-fatal)"
          fi

      - name: Smoke-build the RPM against a stub payload
        run: |
          set -euo pipefail
          # A COPR failure at %install is invisible to rpmbuild -bs, so build
          # both arch RPMs for real against a stub tarball shaped like the
          # release payload. update-spec.sh supplies the matching digests, so
          # this covers the bump script's rewrite too; the rewritten spec is
          # left in place because the checkout is ephemeral and this is the
          # job's last step. File modes are not asserted:
          # brp-mangle-shebangs strips the executable bit from non-ELF stubs,
          # so any mode check here would test the stubs.
          ver="$(sed -n 's/^Version:[[:space:]]*//p' grokbot-linux-port.spec | tr -d '[:space:]')"
          work=/tmp/rpmsmoke
          rm -rf "${work}"
          mkdir -p "${work}/SOURCES"
          for arch in x64 arm64; do
            dir="${work}/Grok_Bot_${ver}_linux_${arch}"
            mkdir -p "${dir}/payload/resources/app.asar.unpacked/dist" "${dir}/hicolor/256x256/apps"
            printf 'grok-bot stub\n' > "${dir}/payload/grok-bot"
            printf 'chrome-sandbox stub\n' > "${dir}/payload/chrome-sandbox"
            printf 'asar stub\n' > "${dir}/payload/resources/app.asar"
            printf 'icon stub\n' > "${dir}/hicolor/256x256/apps/grok-bot.png"
            chmod 700 "${dir}/payload/resources/app.asar.unpacked"
            tar -czf "${work}/SOURCES/Grok_Bot_${ver}_linux_${arch}.tar.gz" \
              -C "${work}" "Grok_Bot_${ver}_linux_${arch}"
          done
          bash scripts/update-spec.sh \
            --sum-x64 "$(sha256sum "${work}/SOURCES/Grok_Bot_${ver}_linux_x64.tar.gz" | awk '{print $1}')" \
            --sum-arm64 "$(sha256sum "${work}/SOURCES/Grok_Bot_${ver}_linux_arm64.tar.gz" | awk '{print $1}')" \
            "${ver}"
          for target in x86_64 aarch64; do
            rpmbuild -bb --target "${target}" --define "_topdir ${work}" grokbot-linux-port.spec
            # Listed to a file, not piped: grep -q exits on the first hit and
            # pipefail would then report the SIGPIPE'd rpm as the failure.
            rpm -qpl "${work}/RPMS/${target}"/*.rpm > "${work}/${target}.list"
            for path in \
              /opt/grokbot-linux-port/chrome-sandbox \
              /opt/grokbot-linux-port/grok-bot \
              /usr/bin/grok-bot \
              /usr/bin/grokbot \
              /usr/share/applications/grok-bot.desktop \
              /usr/share/icons/hicolor/256x256/apps/grok-bot.png \
              /usr/share/licenses/grokbot-linux-port/LICENSE
            do
              grep -Fqx "${path}" "${work}/${target}.list" \
                || { echo "${target} RPM is missing ${path}"; exit 1; }
            done
          done

  # -----------------------------------------------------------------------
  # release — publish GitHub Release, upload artefacts, bump VERSION
  #
  # Downloads the build artefacts, creates (or updates) a GitHub Release via
  # softprops/action-gh-release, commits the new VERSION file, and pushes the
  # tag.  Uses GITHUB_TOKEN with contents:write.
  # -----------------------------------------------------------------------
  release:
    needs: [detect-version, build]
    # Never from a PR: smoke builds are verification only, and a pull_request
    # must not publish a release, bump VERSION, or push a tag. rebuild=true
    # (explicit dispatch of the current version) re-uploads artifacts to the
    # existing release and resyncs the AUR -bin checksum, without touching
    # VERSION or creating a new tag.
    if: (needs.detect-version.outputs.is_new == 'true' || needs.detect-version.outputs.rebuild == 'true') && github.event_name != 'pull_request'
    runs-on: namespace-profile-grokbot-lite
    permissions:
      contents: write
    # surfaced so aur-publish can skip runs where the aur/ tree did not move.
    outputs:
      version: ${{ needs.detect-version.outputs.version }}
      tarball_sum_x64: ${{ steps.artifacts.outputs.tarball_sum_x64 }}
      tarball_sum_arm64: ${{ steps.artifacts.outputs.tarball_sum_arm64 }}
      aur_changed: ${{ steps.aur-bump.outputs.changed }}
      spec_changed: ${{ steps.spec-bump.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required for tag creation and for the VERSION commit
          # to be pushed on top of the current HEAD.
          fetch-depth: 0
          persist-credentials: true

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artefacts
        run: |
          set -euo pipefail
          echo "Release artefacts:"
          ls -lh dist/ || true
          find dist -type f -exec ls -lh {} \;

      - name: Hash release tarballs
        id: artifacts
        env:
          VER: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail
          # Hash the exact bytes this job will upload. update-aur.sh must not
          # re-hash the published URL: GitHub's asset CDN races propagation of
          # freshly uploaded assets, and a re-upload leaves the old sum behind.
          # Both arches come from the single build job; a missing tarball is
          # a build failure, not an expected matrix outcome, so fail hard.
          for arch in x64 arm64; do
            tarball="dist/Grok_Bot_${VER}_linux_${arch}.tar.gz"
            if [[ ! -f "${tarball}" ]]; then
              echo "::error::missing ${tarball} — the repack job must publish both arches" >&2
              exit 1
            fi
            sum="$(sha256sum "${tarball}" | awk '{print $1}')"
            echo "tarball_sum_${arch}=${sum}" >> "${GITHUB_OUTPUT}"
            echo "sha256(${tarball}) = ${sum}"
          done

      - name: Create GitHub Release
        id: ghrelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: Grok Bot ${{ needs.detect-version.outputs.version }} (Linux repack)
          # Always overwrite: a workflow re-run re-uploads the same
          # deterministic tarball bytes; skipping existing assets would
          # publish the -bin checksum of bytes the release no longer serves.
          overwrite_files: true
          body: |
            Grok Bot `${{ needs.detect-version.outputs.version }}` for Linux.

            Repacked verbatim from xAI's official Linux .deb (both x64 and arm64), resolved through api2's canonical download manifest. The payload ships unchanged — same Electron runtime and native modules xAI builds.

            **Install**

            ```bash
            # Arch (AUR)
            yay -S grokbot-linux-port-bin
            # Fedora (COPR)
            sudo dnf copr enable nichokas/grokbot-linux-port && sudo dnf install grokbot-linux-port
            ```

            **Tarball (any distro):**

            ```bash
            tar -xzf Grok_Bot_${{ needs.detect-version.outputs.version }}_linux_x64.tar.gz   # arm64 on aarch64
            cd Grok_Bot_${{ needs.detect-version.outputs.version }}_linux_x64
            # chrome-sandbox requires setuid when not using --no-sandbox
            sudo chown root:root payload/chrome-sandbox && sudo chmod 4755 payload/chrome-sandbox
            ./payload/grok-bot
            ```

            *Automated repack — triggered by daily polling of `https://api2.cursor.sh/updates/api/download/stable/linux-<arch>/sand`.*
          files: |
            dist/*.tar.gz
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump AUR PKGBUILD
        id: aur-bump
        env:
          VER: ${{ needs.detect-version.outputs.version }}
          TARBALL_SUM_X64: ${{ steps.artifacts.outputs.tarball_sum_x64 }}
          TARBALL_SUM_ARM64: ${{ steps.artifacts.outputs.tarball_sum_arm64 }}
          REBUILD: ${{ needs.detect-version.outputs.rebuild }}
        run: |
          set -euo pipefail
          [[ -f aur/grokbot-linux-port-bin/PKGBUILD ]] || { echo "aur/ tree missing"; echo "changed=false" >> "${GITHUB_OUTPUT}"; exit 0; }

          # Both sums are always present (the release step fails hard on a
          # missing arch), so pass them unconditionally.
          if [[ "${REBUILD}" == "true" ]]; then
            # Rebuild resync: the tag and its source archive predate this
            # run, so only the -bin package's freshly rebuilt bytes can be
            # stale. Inject the new sum (a plain pkgrel bump would keep the
            # stale checksum — the exact failure this workflow fixes) and
            # bump pkgrel; AUR helpers ignore same-pkgrel updates. VERSION
            # is left untouched — nothing version-related changed.
            echo "Rebuild of ${VER} — resyncing -bin checksum + pkgrel"
            bash scripts/update-aur.sh --bin-only --bin-sum-x64 "${TARBALL_SUM_X64}" --bin-sum-arm64 "${TARBALL_SUM_ARM64}" "${VER}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Bumping AUR package to ${VER}"
          bash scripts/update-aur.sh --bin-sum-x64 "${TARBALL_SUM_X64}" --bin-sum-arm64 "${TARBALL_SUM_ARM64}" "${VER}"
          if git diff --quiet -- aur/; then
            echo "AUR PKGBUILD already carried ${VER} — nothing to commit"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git add "aur/grokbot-linux-port-bin/PKGBUILD" "aur/grokbot-linux-port-bin/.SRCINFO"
          fi

      - name: Bump RPM spec (COPR)
        id: spec-bump
        env:
          VER: ${{ needs.detect-version.outputs.version }}
          TARBALL_SUM_X64: ${{ steps.artifacts.outputs.tarball_sum_x64 }}
          TARBALL_SUM_ARM64: ${{ steps.artifacts.outputs.tarball_sum_arm64 }}
          REBUILD: ${{ needs.detect-version.outputs.rebuild }}
        run: |
          set -euo pipefail
          [[ -f grokbot-linux-port.spec ]] || { echo "grokbot-linux-port.spec missing"; echo "changed=false" >> "${GITHUB_OUTPUT}"; exit 0; }

          if [[ "${REBUILD}" == "true" ]]; then
            # Same resync semantics as the AUR -bin package: freshly rebuilt
            # release bytes need the new checksum plus a Release bump so
            # installed clients pick the update up.
            bash scripts/update-spec.sh --bump-release --sum-x64 "${TARBALL_SUM_X64}" --sum-arm64 "${TARBALL_SUM_ARM64}" "${VER}"
          else
            bash scripts/update-spec.sh --sum-x64 "${TARBALL_SUM_X64}" --sum-arm64 "${TARBALL_SUM_ARM64}" "${VER}"
          fi
          if git diff --quiet -- grokbot-linux-port.spec; then
            echo "spec already carried ${VER} — nothing to commit"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git add grokbot-linux-port.spec
          fi

      - name: Update VERSION file and push
        env:
          DETECTED_VERSION: ${{ needs.detect-version.outputs.version }}
          AUR_CHANGED: ${{ steps.aur-bump.outputs.changed }}
          SPEC_CHANGED: ${{ steps.spec-bump.outputs.changed }}
          REBUILD: ${{ needs.detect-version.outputs.rebuild }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${REBUILD}" == "true" ]]; then
            # Rebuild resync: only aur/-bin and the spec changed; push them alone.
            if [[ "${AUR_CHANGED}" == "true" || "${SPEC_CHANGED}" == "true" ]]; then
              if [[ "${AUR_CHANGED}" == "true" ]]; then
                git add aur/grokbot-linux-port-bin/PKGBUILD aur/grokbot-linux-port-bin/.SRCINFO
              fi
              if [[ "${SPEC_CHANGED}" == "true" ]]; then
                git add grokbot-linux-port.spec
              fi
              git commit -m "chore: resync ${DETECTED_VERSION} tarball checksum (aur -bin + rpm spec)"
              git push origin "HEAD:${GITHUB_REF_NAME:-main}"
            fi
            exit 0
          fi

          echo "${DETECTED_VERSION}" > VERSION
          git add VERSION
          if git diff --cached --quiet; then
            echo "Nothing to commit (VERSION, AUR and spec already up to date)."
            exit 0
          fi
          if git diff --cached --name-only | grep -q "^aur/" && git diff --cached --name-only | grep -q "^VERSION"; then
            git commit -m "chore: bump VERSION to ${DETECTED_VERSION} (aur ${DETECTED_VERSION})"
          elif git diff --cached --name-only | grep -q "^aur/"; then
            git commit -m "chore(aur): bump to ${DETECTED_VERSION}"
          else
            git commit -m "chore: bump VERSION to ${DETECTED_VERSION}"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      - name: Poke COPR rebuild
        # GitHub suppresses push events for commits pushed with GITHUB_TOKEN,
        # so copr-publish.yml's push trigger never sees this automated bump;
        # fire its repository_dispatch directly instead. Human pushes to main
        # still reach it through the normal push trigger. A repository_dispatch
        # always runs copr-publish.yml at the default-branch head, so only
        # poke when the spec bump actually landed there — a dispatch run from
        # another branch pushes its bump elsewhere and poking would rebuild
        # stale main sources.
        if: steps.spec-bump.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w "copr-rebuild dispatch HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"copr-rebuild"}'

  # -----------------------------------------------------------------------
  # aur-publish — push PKGBUILD + .SRCINFO to aur.archlinux.org
  #
  # The release job only updates the aur/ tree in this repo; publishing to
  # AUR requires the SSH deploy key (AUR_SSH_PRIVATE_KEY). Runs only when the
  # release job actually changed aur/ (fresh version or rebuild resync).
  # -----------------------------------------------------------------------
  aur-publish:
    needs: [release]
    # Only publish when the release changed the AUR tree, and never from a PR.
    if: needs.release.outputs.aur_changed == 'true' && github.event_name != 'pull_request'
    runs-on: namespace-profile-grokbot-lite
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The release job pushed the AUR bump commit on top of the trigger
          # SHA; without an explicit ref this job would check out the stale
          # pre-bump tree and publish outdated checksums to AUR.
          ref: ${{ github.ref_name }}

      - name: Set up AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519_aur
          chmod 600 ~/.ssh/id_ed25519_aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/id_ed25519_aur
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish to AUR
        env:
          VER: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          pkg=grokbot-linux-port-bin
          echo "::group::Publish ${pkg}"
          tmp="$(mktemp -d)"
          git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "${tmp}/${pkg}"
          git -C "${tmp}/${pkg}" config user.name "github-actions[bot]"
          git -C "${tmp}/${pkg}" config user.email "github-actions[bot]@users.noreply.github.com"
          cp "aur/${pkg}/PKGBUILD" "aur/${pkg}/.SRCINFO" "${tmp}/${pkg}/"
          git -C "${tmp}/${pkg}" add PKGBUILD .SRCINFO
          if git -C "${tmp}/${pkg}" diff --cached --quiet; then
            echo "${pkg} already up to date on AUR"
          else
            git -C "${tmp}/${pkg}" commit -m "upgpkg: ${VER}"
            git -C "${tmp}/${pkg}" push origin master
          fi
          rm -rf "${tmp}"
          echo "::endgroup::"
