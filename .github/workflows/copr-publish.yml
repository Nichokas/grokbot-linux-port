name: COPR publish

# Rebuild nichokas/grokbot-linux-port on Fedora COPR after the RPM spec
# lands on main. COPR's rpkg source method will not rebuild until something
# pokes it; this is the COPR analogue of aur-publish.
#
# Push-to-main only: a pull_request must not publish to COPR. Human pushes
# to main fire this via `push`; the automated spec bump from the
# auto-update.yml release job cannot — GitHub suppresses push events for
# commits pushed with GITHUB_TOKEN — so that job fires the copr-rebuild
# repository_dispatch below after its push lands instead. Token lives in
# COPR_WEBHOOK_TOKEN (UUID from COPR → Integrations → Custom webhook).
on:
  push:
    branches: [main]
    paths:
      - grokbot-linux-port.spec
      - .github/workflows/copr-publish.yml
  workflow_dispatch:
  repository_dispatch:
    types: [copr-rebuild]

permissions:
  contents: read

jobs:
  copr-publish:
    runs-on: namespace-profile-grokbot-lite
    steps:
      - name: Trigger COPR rebuild
        env:
          COPR_WEBHOOK_TOKEN: ${{ secrets.COPR_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${COPR_WEBHOOK_TOKEN}" ]]; then
            echo "::error::COPR_WEBHOOK_TOKEN secret is not set (UUID from COPR → Integrations → Custom webhook)" >&2
            exit 1
          fi
          # Custom webhook rebuilds package grokbot-linux-port from SCM.
          # Do not print the URL: it embeds the token.
          curl -fsS -o /dev/null -w "COPR webhook HTTP %{http_code}\n" -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/252834/${COPR_WEBHOOK_TOKEN}/grokbot-linux-port/"
